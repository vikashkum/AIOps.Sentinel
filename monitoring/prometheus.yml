# Prometheus configuration for AIOps Sentinel — Phase 2A
#
# This file configures Prometheus to:
#   1.  Scrape itself (meta-monitoring)
#   2.  Scrape AIOps Sentinel's own /metrics endpoint (if you expose one)
#   3.  Provide a ready-to-extend template for your real application targets
#
# To add your own services, copy the job_name template under
# "# YOUR APPLICATION TARGETS" and fill in the correct targets.
#
# After editing, reload without restart:
#   curl -X POST http://localhost:9090/-/reload

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: aiops-sentinel

# ── Alert rules (optional — load from files/rules/) ──────────────────────────
# rule_files:
#   - "files/rules/*.yml"

# ── Scrape configurations ─────────────────────────────────────────────────────
scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # AIOps Sentinel backend — live request rates, latency, error counts per endpoint
  - job_name: aiops-sentinel-backend
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics

  # ── YOUR APPLICATION TARGETS ─────────────────────────────────────────────
  # Copy this block for each real service you want to monitor.
  # AIOps Sentinel will automatically pick up any job defined here
  # when PROMETHEUS_JOBS is blank (auto-discovery mode).
  #
  # - job_name: api-gateway
  #   static_configs:
  #     - targets: ["api-gateway:8080"]
  #   scrape_interval: 10s
  #
  # - job_name: order-service
  #   static_configs:
  #     - targets: ["order-service:8081"]
  #
  # - job_name: payment-service
  #   static_configs:
  #     - targets: ["payment-service:8082"]
  #
  # For Kubernetes service discovery, replace static_configs with:
  # kubernetes_sd_configs:
  #   - role: pod
  # relabel_configs: ...
