{{- if .Values.loki.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aiops-sentinel.loki.name" . }}
  namespace: {{ include "aiops-sentinel.namespace" . }}
  labels:
    {{- include "aiops-sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
  annotations:
    checksum/config: {{ include (print $.Template.BasePath "/loki/configmap.yaml") . | sha256sum }}
spec:
  replicas: 1
  strategy:
    type: Recreate   # ReadWriteOnce PVC — only one pod can attach at a time
  selector:
    matchLabels:
      {{- include "aiops-sentinel.componentLabels" (dict "component" "loki" "ctx" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aiops-sentinel.componentLabels" (dict "component" "loki" "ctx" .) | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: loki
          image: "{{ .Values.loki.image.repository }}:{{ .Values.loki.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - "-config.file=/etc/loki/local-config.yaml"
          ports:
            - name: http
              containerPort: {{ .Values.loki.port }}
            - name: grpc
              containerPort: 9096
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            {{- if .Values.loki.persistence.enabled }}
            - name: data
              mountPath: /loki
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "aiops-sentinel.loki.name" . }}-config
        {{- if .Values.loki.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "aiops-sentinel.loki.name" . }}-data
        {{- end }}
{{- end }}
