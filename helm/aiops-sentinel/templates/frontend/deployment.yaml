# ═══════════════════════════════════════════════════════════════════════════════
# Kubernetes Deployment — Frontend (React + Nginx)
#
# The frontend is a static React app built at Docker image build time.
# Nginx serves the pre-built files and proxies /api/* requests to the backend.
#
# NOTE: The React app is compiled into static HTML/JS/CSS.
# API calls from the BROWSER go directly to the backend Service (NodePort),
# NOT through Kubernetes internal DNS. Kubernetes DNS is only for
# server-to-server calls within the cluster.
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aiops-sentinel.frontend.name" . }}
  namespace: {{ include "aiops-sentinel.namespace" . }}
  labels:
    {{- include "aiops-sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    checksum/nginx: {{ include (print $.Template.BasePath "/frontend/configmap.yaml") . | sha256sum }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  # Frontend is stateless and can safely run multiple replicas.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "aiops-sentinel.componentLabels" (dict "component" "frontend" "ctx" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aiops-sentinel.componentLabels" (dict "component" "frontend" "ctx" .) | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.global.appImagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          # Nginx serves static files — a simple HTTP check on / is sufficient.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            # Override the nginx config baked into the image with the
            # Kubernetes-aware version that uses the correct service DNS name.
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "aiops-sentinel.frontend.name" . }}-nginx
