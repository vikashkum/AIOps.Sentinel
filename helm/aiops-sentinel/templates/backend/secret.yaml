# ═══════════════════════════════════════════════════════════════════════════════
# Kubernetes Secret — Backend Sensitive Credentials
#
# CONCEPT: A Secret is like a ConfigMap but for sensitive data.
# Data is base64-encoded and can be encrypted at rest (etcd encryption).
#
# Secret types:
#   Opaque                          — arbitrary key-value data (most common)
#   kubernetes.io/tls               — TLS certificates
#   kubernetes.io/dockerconfigjson  — Docker registry credentials
#   kubernetes.io/service-account-token — SA tokens (auto-created)
#
# HOW PODS CONSUME SECRETS:
#   1. Environment variables:  env[].valueFrom.secretKeyRef
#   2. Bulk env injection:     envFrom[].secretRef       ← we use this
#   3. Mounted as files:       volumes[].secret
#
# PRODUCTION BEST PRACTICES (beyond this chart):
#   - Use external-secrets-operator + AWS Secrets Manager / Azure Key Vault
#   - Enable etcd encryption at rest
#   - Use Sealed Secrets (Bitnami) to safely commit encrypted secrets to Git
#   - Never use --set for secrets in CI/CD; use a secrets management pipeline
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aiops-sentinel.backend.name" . }}-secret
  namespace: {{ include "aiops-sentinel.namespace" . }}
  labels:
    {{- include "aiops-sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
# Opaque = arbitrary key/value pairs. Kubernetes base64-encodes them automatically
# when you use `stringData`. Use `data` if you provide already-encoded values.
type: Opaque
stringData:
  GROQ_API_KEY: {{ .Values.backend.groqApiKey | quote }}
